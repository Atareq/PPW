services:
  redis:
    restart: unless-stopped

  app:
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles

  celery_worker:
    restart: unless-stopped
    env_file:
      - .env.prod

  celery_beat:
    restart: unless-stopped
    env_file:
      - .env.prod

  nginx:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  static_volume:
