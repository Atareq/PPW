[pytest]
DJANGO_SETTINGS_MODULE = ppw.settings.test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    ; --strict-markers
    ; --cov=apps
    ; --cov-report=html
    ; --cov-report=term-missing
    ; --cov-fail-under=80
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
