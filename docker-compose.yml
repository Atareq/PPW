services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppw_app
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles

  nginx:
    image: nginx:stable
    container_name: ppw_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  static_volume:
